name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec rake test
      - run: gem build screenshotapi.gemspec
